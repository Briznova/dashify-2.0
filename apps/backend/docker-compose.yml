services:
  postgres:
    image: postgres:16-alpine
    container_name: dashify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dashify
      POSTGRES_USER: dashify_migrator
      POSTGRES_PASSWORD: local_migrate_password
    ports:
      - "5433:5432"
    volumes:
      - dashify_pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashify_migrator -d dashify"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  dashify_pgdata:
