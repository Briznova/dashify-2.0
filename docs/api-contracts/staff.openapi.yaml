openapi: 3.1.0
info:
  title: Dashify Staff API
  version: 1.0.0
  description: School-scoped staff profiles, Teacher account creation, departments, and teacher assignments.
servers:
  - url: /api/v1
security:
  - accessCookie: []
paths:
  /staff/teacher-accounts:
    post:
      operationId: createTeacherAccount
      summary: Create a new Teacher login and linked staff profile
      x-required-permission: staff.manage
      x-required-workspace: school_admin
      x-tenant-scope: authenticated active school
      description: >
        Creates a new global user, active membership, standard Teacher role, and
        staff profile atomically. Existing email addresses are rejected
        case-insensitively. The administrator sets the initial password; no
        invitation, delivery, email verification, or forced password change is
        provided. The password is not returned or included in the audit.
        The optional department must be active and belong to this school.
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherAccount"
      responses:
        "201":
          description: Created staff profile and non-secret user details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Active school or department not found
        "409":
          description: Existing account, duplicate employee code, or nonstandard Teacher role
        "429":
          description: Rate limit exceeded
  /departments:
    get:
      operationId: listDepartments
      summary: List active and inactive departments in the active school
      x-required-permission: staff.read
      x-required-workspace: school_admin
      responses:
        "200":
          description: School departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createDepartment
      summary: Add a department in the active school
      x-required-permission: school.update
      x-required-workspace: school_admin
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: Department name already exists, ignoring case
  /departments/{id}:
    patch:
      operationId: updateDepartment
      summary: Rename or deactivate an active department
      x-required-permission: school.update
      x-required-workspace: school_admin
      description: Deactivation retains existing staff assignments; inactive departments cannot be assigned to new staff.
      parameters:
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                isActive:
                  const: false
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Active department not found in the active school
        "409":
          description: Department name already exists, ignoring case
  /staff:
    get:
      operationId: listStaff
      summary: List active staff profiles in the active school
      x-required-permission: staff.read
      x-tenant-scope: authenticated active school
      responses:
        "200":
          description: Active-school staff profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StaffProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: createStaff
      summary: Create a staff profile and optionally link an existing teacher account
      x-required-permission: staff.manage
      x-tenant-scope: authenticated active school
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/CsrfHeader"
      description: >
        Linking by accountEmail requires that the user already exists. The operation
        creates a membership when none exists and grants only this school's Teacher
        role. Existing suspended, revoked, or invited memberships are rejected. It
        does not create a login, invite a user, or set credentials. Do not send both
        userId and accountEmail. If supplied, department must match an active
        department in the active school; designation must be Teacher.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStaff"
      responses:
        "201":
          description: Created staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Existing account was not found
        "409":
          description: Duplicate employee code, account link, or inactive membership
  /staff/{id}:
    get:
      operationId: getStaff
      summary: Get a staff profile in the active school
      x-required-permission: staff.read
      x-tenant-scope: authenticated active school
      parameters:
        - $ref: "#/components/parameters/StaffId"
      responses:
        "200":
          description: Active-school staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Staff profile was not found in the active school
    patch:
      operationId: updateStaff
      summary: Update an active staff profile
      x-required-permission: staff.manage
      x-tenant-scope: authenticated active school
      parameters:
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStaff"
      responses:
        "200":
          description: Updated staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Staff profile was not found in the active school
        "409":
          description: Employee code is already in use in this school
  /staff/{id}/deactivate:
    post:
      operationId: deactivateStaff
      summary: Deactivate a staff profile and revoke its Teacher access
      x-required-permission: staff.manage
      x-tenant-scope: authenticated active school
      parameters:
        - $ref: "#/components/parameters/StaffId"
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/CsrfHeader"
      responses:
        "200":
          description: Deactivated staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Active staff profile was not found in the active school
  /teacher-assignments:
    get:
      operationId: listTeacherAssignments
      summary: List active teacher assignments in the active school
      x-required-permission: staff.read
      x-tenant-scope: authenticated active school
      responses:
        "200":
          description: Active-school teacher assignments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeacherAssignment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: assignTeacher
      summary: Assign a staff profile to a class or section
      x-required-permission: staff.manage
      x-tenant-scope: authenticated active school
      parameters:
        - $ref: "#/components/parameters/OriginHeader"
        - $ref: "#/components/parameters/CsrfHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTeacherAssignment"
      responses:
        "201":
          description: Created or reactivated assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeacherAssignment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Staff member, class, or section was not found in the active school
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: dashify_access
  parameters:
    OriginHeader:
      name: Origin
      in: header
      required: true
      schema:
        type: string
        format: uri
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
    StaffId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    Department:
      type: object
      required: [id, name, isActive]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        isActive:
          type: boolean
    CreateTeacherAccount:
      type: object
      additionalProperties: false
      required: [employeeCode, firstName, email, password]
      properties:
        employeeCode:
          type: string
          minLength: 1
          maxLength: 20
        firstName:
          type: string
          minLength: 1
          maxLength: 80
        lastName:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 160
        password:
          type: string
          format: password
          minLength: 12
          maxLength: 1024
        phone:
          type: string
          maxLength: 30
        departmentId:
          type: string
          format: uuid
    CreateStaff:
      type: object
      required: [employeeCode, firstName]
      properties:
        userId:
          type: string
          format: uuid
          description: Existing user ID; links the user and grants only the Teacher role; mutually exclusive with accountEmail.
        accountEmail:
          type: string
          format: email
          maxLength: 160
          description: Existing user's email; links the user and grants only the Teacher role.
        employeeCode:
          type: string
          maxLength: 20
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 160
        phone:
          type: string
          maxLength: 30
        designation:
          type: string
          enum: [Teacher]
        department:
          type: string
          maxLength: 80
          description: Name of an active department in the active school, matched case-insensitively.
    UpdateStaff:
      type: object
      minProperties: 1
      properties:
        employeeCode:
          type: string
          maxLength: 20
        firstName:
          type: string
          maxLength: 80
        lastName:
          type: string
          maxLength: 80
        email:
          type: string
          format: email
          maxLength: 160
        phone:
          type: string
          maxLength: 30
        designation:
          type: string
          enum: [Teacher]
        department:
          type: string
          maxLength: 80
          description: Active department name; mutually exclusive with departmentId.
        departmentId:
          type: [string, "null"]
          format: uuid
          description: Active department ID, current inactive department ID, or null to clear.
    StaffProfile:
      type: object
      required: [id, schoolId, userId, employeeCode, firstName, isActive]
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        userId:
          type: [string, "null"]
          format: uuid
        employeeCode:
          type: [string, "null"]
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        email:
          type: [string, "null"]
        phone:
          type: [string, "null"]
        designation:
          type: [string, "null"]
        department:
          type: [string, "null"]
          description: Legacy free-text value, if present.
        departmentId:
          type: [string, "null"]
          format: uuid
        departmentRecord:
          oneOf:
            - $ref: "#/components/schemas/Department"
            - type: "null"
        isActive:
          type: boolean
        user:
          oneOf:
            - type: object
              properties:
                id:
                  type: string
                  format: uuid
                email:
                  type: string
                  format: email
                firstName:
                  type: string
                lastName:
                  type: [string, "null"]
            - type: "null"
    CreateTeacherAssignment:
      type: object
      required: [staffId, classId]
      properties:
        staffId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        subject:
          type: string
    TeacherAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        schoolId:
          type: string
          format: uuid
        staffId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        sectionId:
          type: [string, "null"]
          format: uuid
        subject:
          type: [string, "null"]
        isActive:
          type: boolean
    Error:
      type: object
      properties:
        statusCode:
          type: integer
        message:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
  responses:
    BadRequest:
      description: Invalid request data
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Missing required permission
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
