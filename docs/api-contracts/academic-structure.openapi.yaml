openapi: 3.1.0
info:
  title: Dashify Academic Structure API
  version: 1.0.0
  description: School-scoped academic years, grade scales, classes, and sections.
servers:
  - url: /api/v1
security:
  - accessCookie: []
paths:
  /academic-years:
    get:
      operationId: listAcademicYears
      summary: List academic years in the active school
      x-required-permission: academic_structure.read
      x-tenant-scope: authenticated active school
      responses:
        "200":
          description: Academic years ordered by start date, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AcademicYear"
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
    post:
      operationId: createAcademicYear
      summary: Create a draft academic year
      description: New academic years always start in DRAFT status.
      x-required-permission: academic_structure.manage
      x-tenant-scope: authenticated active school
      parameters:
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAcademicYear"
      responses:
        "201":
          description: Created draft academic year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        "400": { description: Invalid name or date range }
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "409": { description: Date range overlaps another draft or active year }
  /academic-years/{id}/activate:
    post:
      operationId: activateAcademicYear
      summary: Activate a draft academic year
      description: >
        Activation is allowed only when the school-local date is within the
        inclusive start/end dates and no other academic year is ACTIVE. Complete
        the current active year after its end date before activating another.
      x-required-permission: academic_structure.manage
      x-tenant-scope: authenticated active school
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: Activated academic year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "404": { description: Academic year not found in the active school }
        "409": { description: Invalid transition, date outside the year, or another year is active }
  /academic-years/{id}/complete:
    post:
      operationId: completeAcademicYear
      summary: Complete an active academic year
      description: >
        An active year can be completed only after its end date in the school's
        timezone. COMPLETED is a terminal, read-only status.
      x-required-permission: academic_structure.manage
      x-tenant-scope: authenticated active school
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      responses:
        "201":
          description: Completed academic year
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AcademicYear"
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "404": { description: Academic year not found in the active school }
        "409": { description: Year is not active or its end date has not passed }
  /academic-years/{id}/grade-scale:
    get:
      operationId: getAcademicYearGradeScale
      summary: Read the grading scale configured for an academic year
      x-required-permission: academic_structure.read
      x-tenant-scope: authenticated active school
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The academic year and its configured grade bands, or an empty band list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeScale"
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "404": { description: Academic year not found in the active school }
    put:
      operationId: saveAcademicYearGradeScale
      summary: Create or replace an academic year's complete grading scale
      description: Bands must have unique labels and cover 0-100 without gaps or overlaps.
      x-required-permission: academic_structure.manage
      x-tenant-scope: authenticated active school
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveGradeScale"
      responses:
        "200":
          description: Saved academic-year grade scale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GradeScale"
        "400": { description: Invalid or incomplete grade bands }
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "404": { description: Academic year not found in the active school }
  /classes/with-section:
    post:
      operationId: createClassWithSection
      summary: Create a class and its first section atomically
      x-required-permission: academic_structure.manage
      x-tenant-scope: authenticated active school
      parameters:
        - in: header
          name: Origin
          required: true
          schema:
            type: string
        - in: header
          name: X-CSRF-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, code, section]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                code: { type: string, minLength: 1, maxLength: 20 }
                sortOrder: { type: integer, minimum: 0 }
                section:
                  type: object
                  additionalProperties: false
                  required: [name, code]
                  properties:
                    name: { type: string, minLength: 1, maxLength: 40 }
                    code: { type: string, minLength: 1, maxLength: 20 }
                    capacity: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Class and its first section created together
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassWithSection"
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "409": { description: Class code already exists in the active school }
  /classes/{id}:
    put:
      operationId: updateClass
      summary: Update an active class
      x-required-permission: academic_structure.manage
      x-tenant-scope: authenticated active school
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, code, sortOrder]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
                code: { type: string, minLength: 1, maxLength: 20 }
                sortOrder: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Updated class with sections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Class" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "404": { description: Class not found in the active school }
        "409": { description: Class code already exists in the active school }
  /classes/{classId}/sections/{sectionId}:
    put:
      operationId: updateSection
      summary: Update an active section in an active class
      description: Capacity cannot be below the active unended non-archived student count in any academic year.
      x-required-permission: academic_structure.manage
      x-tenant-scope: authenticated active school
      parameters:
        - in: path
          name: classId
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: sectionId
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/Origin"
        - $ref: "#/components/parameters/Csrf"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name, code, capacity]
              properties:
                name: { type: string, minLength: 1, maxLength: 40 }
                code: { type: string, minLength: 1, maxLength: 20 }
                capacity: { type: [integer, "null"], minimum: 1 }
      responses:
        "200":
          description: Updated section
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Section" }
        "400": { description: Invalid input }
        "401": { description: Authentication required }
        "403": { description: Missing permission or invalid active-school context }
        "404": { description: Active section not found in the active class and school }
        "409": { description: Duplicate section code or capacity below enrollment }
components:
  parameters:
    Origin:
      in: header
      name: Origin
      required: true
      schema: { type: string }
    Csrf:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: dashify_access
  schemas:
    CreateAcademicYear:
      type: object
      additionalProperties: false
      required: [name, startDate, endDate]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
    AcademicYear:
      type: object
      required: [id, schoolId, name, startDate, endDate, status]
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        status:
          type: string
          enum: [DRAFT, ACTIVE, COMPLETED]
    SaveGradeScale:
      type: object
      additionalProperties: false
      required: [bands]
      properties:
        bands:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: false
            required: [label, minPercent, maxPercent]
            properties:
              label: { type: string, minLength: 1, maxLength: 20 }
              minPercent: { type: integer, minimum: 0, maximum: 100 }
              maxPercent: { type: integer, minimum: 0, maximum: 100 }
    GradeScale:
      type: object
      required: [academicYearId, academicYearName, bands]
      properties:
        academicYearId: { type: string, format: uuid }
        academicYearName: { type: string }
        bands:
          type: array
          items:
            $ref: "#/components/schemas/GradeBand"
    GradeBand:
      type: object
      required: [id, scaleId, label, minPercent, maxPercent, sortOrder]
      properties:
        id: { type: string, format: uuid }
        scaleId: { type: string, format: uuid }
        label: { type: string, maxLength: 20 }
        minPercent: { type: integer, minimum: 0, maximum: 100 }
        maxPercent: { type: integer, minimum: 0, maximum: 100 }
        sortOrder: { type: integer }
    ClassWithSection:
      allOf:
        - $ref: "#/components/schemas/Class"
        - type: object
          properties:
            sections: { type: array, minItems: 1, maxItems: 1 }
    Class:
      type: object
      required: [id, schoolId, name, code, sortOrder, isActive, sections]
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        sortOrder: { type: integer }
        isActive: { type: boolean }
        sections:
          type: array
          items:
            $ref: "#/components/schemas/Section"
    Section:
      type: object
      required: [id, schoolId, classId, name, code, capacity, isActive]
      properties:
        id: { type: string, format: uuid }
        schoolId: { type: string, format: uuid }
        classId: { type: string, format: uuid }
        name: { type: string }
        code: { type: string }
        capacity: { type: [integer, "null"] }
        isActive: { type: boolean }
